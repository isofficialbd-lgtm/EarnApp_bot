<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earn App</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f8;
  color:#111;
}
main{
  max-width:520px;
  margin:auto;
  padding:18px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
header small{color:#777}
header h1{margin:5px 0;font-size:30px}
#avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  box-shadow:0 3px 12px #ddd;
}
.balance{
  background:#1685e5;
  color:white;
  padding:25px;
  border-radius:25px;
  margin-bottom:18px;
}
.balance small{
  display:block;
  font-size:16px;
  opacity:.9;
}
.balance strong{
  display:block;
  font-size:38px;
  margin-top:8px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.grid button{
  border:0;
  background:#fff;
  border-radius:22px;
  padding:22px 15px;
  text-align:left;
  cursor:pointer;
  box-shadow:0 3px 12px #e1e1e1;
}
.grid button:active{transform:scale(.97)}
.grid b{
  display:block;
  font-size:20px;
  margin:8px 0 3px;
}
.grid small{color:#777}
.panel{
  background:#fff;
  border-radius:22px;
  padding:20px;
  margin-top:18px;
  min-height:180px;
}
.task{
  background:#f7f8fa;
  border-radius:18px;
  padding:16px;
  margin:12px 0;
}
.task h3{margin-top:0}
.primary{
  width:100%;
  border:0;
  background:#1685e5;
  color:#fff;
  padding:13px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}
.primary:active{transform:scale(.98)}
.primary:disabled{
  opacity:.5;
}
.input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  margin:7px 0;
  font-size:15px;
}
nav{
  display:flex;
  justify-content:space-around;
  background:#fff;
  border-radius:18px;
  padding:8px;
  margin-top:18px;
}
nav button{
  border:0;
  background:transparent;
  font-size:22px;
  padding:10px 20px;
  cursor:pointer;
}
a{
  text-decoration:none;
}
.info{
  background:#eef6ff;
  padding:12px;
  border-radius:12px;
  margin:10px 0;
}
</style>
</head>

<body>

<!-- SOCIAL AD: অ্যাপ চালু হলে এই ad script চলবে -->
<script src="https://disturbknockedcaterpillar.com/3e/7d/b8/3e7db85819271822795c82ae1409726a.js"></script>

<main>

<header>
  <div>
    <small>স্বাগতম</small>
    <h1 id="name">বন্ধু</h1>
  </div>
  <div id="avatar">👤</div>
</header>

<section class="balance">
  <small>Balance</small>
  <strong>৳ <span id="balance">0.00</span></strong>
</section>

<section class="grid">

<button onclick="loadTasks()">
  📋
  <b>Tasks</b>
  <small>কাজ করে আয়</small>
</button>

<button onclick="showReferral()">
  🎁
  <b>Referral</b>
  <small>বন্ধু আনুন</small>
</button>

<button onclick="showProfile()">
  👤
  <b>Profile</b>
  <small>অ্যাকাউন্ট</small>
</button>

<button onclick="showWithdraw()">
  💸
  <b>Withdraw</b>
  <small>টাকা তুলুন</small>
</button>

</section>

<div id="content" class="panel">
  <h2>🏠 Home</h2>
  <p>আপনার Earn App প্রস্তুত।</p>
</div>

<nav>
  <button onclick="home()">🏠</button>
  <button onclick="loadTasks()">📋</button>
  <button onclick="showReferral()">🎁</button>
  <button onclick="showProfile()">👤</button>
</nav>

</main>

<script>

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}

const user = tg?.initDataUnsafe?.user || {};

const MIN_WITHDRAW = 100;
const REQUIRED_REFERRALS = 15;


/* =========================
   TASKS
========================= */

const TASKS = [

{
 id:"ad1",
 type:"ad",
 title:"Ad দেখুন — ১",
 description:"Ad খুলে দেখুন।",
 reward:20,
 url:"https://disturbknockedcaterpillar.com/s9usjceyn9?key=2db1a989202572aeb944d7cf996d94a3"
},

{
 id:"ad2",
 type:"ad",
 title:"Ad দেখুন — ২",
 description:"Ad খুলে দেখুন।",
 reward:20,
 url:"https://disturbknockedcaterpillar.com/qfme9v7p?key=edfb6770abc53de1b56dca94b91dddc2"
},

{
 id:"ad3",
 type:"ad",
 title:"Ad দেখুন — ৩",
 description:"Ad খুলে দেখুন।",
 reward:20,
 url:"https://disturbknockedcaterpillar.com/sp0ec1ycks?key=4d089fbae56772209635d0cd7f534658"
},

{
 id:"channel",
 type:"channel",
 title:"YouTube Channel Subscribe",
 description:"YouTube Channel Subscribe করুন।",
 reward:50,
 url:"https://youtube.com/@isofficialbd?si=HLIH5G2k5Xudcx5n"
},

{
 id:"video1",
 type:"video",
 title:"YouTube Video Task ১",
 description:"ভিডিও দেখুন, Like ও Comment করুন।",
 reward:20,
 url:"https://youtu.be/BtQTtf4fmz8?si=sgjeD8a6jg2CadVn"
},

{
 id:"video2",
 type:"video",
 title:"YouTube Video Task ২",
 description:"ভিডিও দেখুন, Like ও Comment করুন।",
 reward:20,
 url:"https://youtu.be/fdDt7Vp_nZ0?si=2ehsIn-KrZNXRY23"
}

];


/* =========================
   ELEMENT
========================= */

const nameEl=document.getElementById("name");
const avatarEl=document.getElementById("avatar");
const balanceEl=document.getElementById("balance");
const contentEl=document.getElementById("content");


nameEl.textContent=user.first_name || "বন্ধু";

avatarEl.textContent=
(user.first_name || "U").charAt(0).toUpperCase();


/* =========================
   LOCAL DATA
========================= */

function getBalance(){
 return Number(localStorage.getItem("earn_balance") || "0");
}

function setBalance(value){
 localStorage.setItem("earn_balance",Number(value).toFixed(2));
}

function getCompleted(){
 try{
  return JSON.parse(
   localStorage.getItem("completed_tasks") || "[]"
  );
 }catch{
  return [];
 }
}

function saveCompleted(data){
 localStorage.setItem(
  "completed_tasks",
  JSON.stringify(data)
 );
}

function getReferrals(){
 return Number(
  localStorage.getItem("referral_count") || "0"
 );
}

function refresh(){
 balanceEl.textContent=getBalance().toFixed(2);
}


/* =========================
   OPEN LINK
========================= */

function openLink(url){

 if(tg && tg.openLink){
   tg.openLink(url);
 }else{
   window.open(url,"_blank");
 }

}


/* =========================
   HOME
========================= */

function home(){

 contentEl.innerHTML=`

 <h2>🏠 Home</h2>

 <p>
 স্বাগতম,
 <b>${user.first_name || "বন্ধু"}</b> ❤️
 </p>

 <div class="info">
 💰 আপনার Balance:
 <b>৳${getBalance().toFixed(2)}</b>
 </div>

 <div class="info">
 👥 Referral:
 <b>${getReferrals()} / ${REQUIRED_REFERRALS}</b>
 </div>

 `;

 refresh();
}


/* =========================
   TASKS
========================= */

function loadTasks(){

 const completed=getCompleted();

 contentEl.innerHTML=`

 <h2>📋 Tasks</h2>

 <p>Task সম্পন্ন করে Reward নিন 💰</p>

 ${TASKS.map(task=>{

 const done=completed.includes(task.id);

 return `

 <div class="task">

 <h3>
 ${task.type==="ad"?"📢":""}
 ${task.type==="channel"?"📺":""}
 ${task.type==="video"?"🎬":""}
 ${task.title}
 </h3>

 <p>${task.description}</p>

 <p>
 💰 Reward:
 <b>৳${task.reward}</b>
 </p>

 ${
 done
 ?
 `<button class="primary" disabled>
   ✅ Completed
  </button>`
 :
 `<button class="primary"
   onclick="startTask('${task.id}')">
   🔗 Task Open করুন
  </button>`
 }

 </div>

 `;

 }).join("")}

 `;

}


/* =========================
   START TASK
========================= */

function startTask(id){

 const task=TASKS.find(x=>x.id===id);

 if(!task)return;

 const completed=getCompleted();

 if(completed.includes(id)){
   alert("এই Task ইতিমধ্যে Complete করা হয়েছে।");
   return;
 }

 openLink(task.url);

 setTimeout(()=>{

   const ok=confirm(
    "আপনি কি Task সম্পন্ন করেছেন?\n\n"+
    "OK চাপলে ৳"+task.reward+
    " Reward যোগ হবে।"
   );

   if(!ok)return;

   completed.push(task.id);

   saveCompleted(completed);

   setBalance(
    getBalance()+Number(task.reward)
   );

   refresh();

   alert(
    "🎉 Task Complete!\n"+
    "৳"+task.reward+
    " Reward যোগ হয়েছে।"
   );

   loadTasks();

 },15000);

}


/* =========================
   REFERRAL
========================= */

function showReferral(){

 const code=user.id || "demo";

 const link=
 location.origin+"/?ref="+code;

 contentEl.innerHTML=`

 <h2>🎁 Referral</h2>

 <div class="task">

 <p>
 বন্ধু Invite করুন।
 </p>

 <p>
 প্রতি valid referral:
 <b>৳20</b>
 </p>

 <p>
 আপনার Referral:
 <b>${getReferrals()} / ${REQUIRED_REFERRALS}</b>
 </p>

 <input
 id="refLink"
 class="input"
 readonly
 value="${link}"
 >

 <button class="primary"
 onclick="copyReferral()">
 📋 Copy Referral Link
 </button>

 </div>

 `;

}


/* =========================
   COPY
========================= */

function copyReferral(){

 const input=document.getElementById("refLink");

 if(!input)return;

 navigator.clipboard.writeText(input.value)
 .then(()=>{
   alert("✅ Referral Link Copy হয়েছে!");
 })
 .catch(()=>{
   input.select();
   document.execCommand("copy");
   alert("✅ Referral Link Copy হয়েছে!");
 });

}


/* =========================
   PROFILE
========================= */

function showProfile(){

 contentEl.innerHTML=`

 <h2>👤 Profile</h2>

 <div class="task">

 <p>
 Name:
 <b>${user.first_name || "Demo"}</b>
 </p>

 <p>
 Telegram ID:
 <b>${user.id || "Demo"}</b>
 </p>

 <p>
 💰 Balance:
 <b>৳${getBalance().toFixed(2)}</b>
 </p>

 <p>
 👥 Referral:
 <b>${getReferrals()}</b>
 </p>

 </div>

 `;

}


/* =========================
   WITHDRAW
========================= */

function showWithdraw(){

 const balance=getBalance();
 const refs=getReferrals();

 if(refs < REQUIRED_REFERRALS){

 contentEl.innerHTML=`

 <h2>💸 Withdraw</h2>

 <div class="task">

 <h3>🔒 Withdraw Locked</h3>

 <p>
 টাকা তুলতে আগে
 <b>১৫টি Referral</b>
 সম্পূর্ণ করতে হবে।
 </p>

 <p>
 আপনার Referral:
 <b>${refs} / ${REQUIRED_REFERRALS}</b>
 </p>

 <p>
 আরও
 <b>${REQUIRED_REFERRALS-refs}</b>
 টি Referral প্রয়োজন।
 </p>

 <button class="primary"
 onclick="showReferral()">
 🎁 Referral করুন
 </button>

 </div>

 `;

 return;
 }


 if(balance < MIN_WITHDRAW){

 contentEl.innerHTML=`

 <h2>💸 Withdraw</h2>

 <div class="task">

 <h3>🔒 Minimum Balance প্রয়োজন</h3>

 <p>
 Minimum Withdraw:
 <b>৳${MIN_WITHDRAW}</b>
 </p>

 <p>
 আপনার Balance:
 <b>৳${balance.toFixed(2)}</b>
 </p>

 </div>

 `;

 return;
 }


 contentEl.innerHTML=`

 <h2>💸 Withdraw</h2>

 <div class="task">

 <p>
 Available Balance:
 <b>৳${balance.toFixed(2)}</b>
 </p>

 <input
 id="amount"
 class="input"
 type="number"
 min="100"
 max="${balance}"
 placeholder="টাকার পরিমাণ"
 >

 <input
 id="phone"
 class="input"
 type="tel"
 placeholder="bKash / Nagad নম্বর"
 >

 <button class="primary"
 onclick="submitWithdraw()">
 💸 Withdraw Request
 </button>

 </div>

 `;

}


/* =========================
   WITHDRAW SUBMIT
========================= */

function submitWithdraw(){

 const amount=Number(
  document.getElementById("amount")?.value || 0
 );

 const phone=
 document.getElementById("phone")?.value.trim() || "";

 const balance=getBalance();

 if(amount<MIN_WITHDRAW){
  alert("Minimum Withdraw ৳100");
  return;
 }

 if(amount>balance){
  alert("Balance-এর চেয়ে বেশি টাকা তুলতে পারবেন না।");
  return;
 }

 if(!phone){
  alert("bKash / Nagad নম্বর দিন।");
  return;
 }

 alert(
  "✅ Withdraw Request নেওয়া হয়েছে।\n\n"+
  "তবে মনে রাখবেন: এই version-এ এখনো কোনো real server/payment system যুক্ত নেই।"
 );

}


/* =========================
   START
========================= */

refresh();

</script>

</body>
</html>
