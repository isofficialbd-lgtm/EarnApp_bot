<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earn Mini App</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f3f5f8;
font-family:Arial,sans-serif;
color:#111;
}

main{
max-width:520px;
margin:auto;
padding:18px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

header small{color:#777}

header h1{
margin:5px 0;
font-size:28px;
}

#avatar{
width:55px;
height:55px;
border-radius:50%;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
box-shadow:0 3px 12px #ddd;
}

.balance{
background:#1685e5;
color:#fff;
padding:24px;
border-radius:24px;
margin-bottom:18px;
}

.balance small{
display:block;
opacity:.9;
}

.balance strong{
display:block;
font-size:36px;
margin-top:7px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.grid button{
border:0;
background:#fff;
border-radius:20px;
padding:20px 14px;
text-align:left;
cursor:pointer;
box-shadow:0 3px 12px #ddd;
}

.grid button:active{
transform:scale(.97);
}

.grid b{
display:block;
font-size:19px;
margin:7px 0 3px;
}

.grid small{
color:#777;
}

.panel{
background:#fff;
border-radius:20px;
padding:18px;
margin-top:18px;
min-height:180px;
}

.task{
background:#f7f8fa;
border-radius:16px;
padding:15px;
margin:12px 0;
}

.task h3{
margin-top:0;
}

.primary{
width:100%;
border:0;
background:#1685e5;
color:#fff;
padding:13px;
border-radius:11px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.primary:active{
transform:scale(.98);
}

.primary:disabled{
opacity:.5;
}

.input{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:11px;
margin:6px 0;
font-size:15px;
}

nav{
display:flex;
justify-content:space-around;
background:#fff;
border-radius:18px;
margin-top:18px;
padding:7px;
}

nav button{
border:0;
background:transparent;
font-size:22px;
padding:10px 18px;
cursor:pointer;
}

.info{
background:#eef6ff;
padding:12px;
border-radius:12px;
margin:10px 0;
}
</style>
</head>

<body>

<!-- SOCIAL AD -->
<script src="https://disturbknockedcaterpillar.com/3e/7d/b8/3e7db85819271822795c82ae1409726a.js"></script>

<main>

<header>
<div>
<small>স্বাগতম</small>
<h1 id="name">বন্ধু</h1>
</div>
<div id="avatar">👤</div>
</header>

<section class="balance">
<small>Balance</small>
<strong>৳ <span id="balance">0.00</span></strong>
</section>

<section class="grid">

<button type="button" onclick="loadTasks()">
📋
<b>Tasks</b>
<small>কাজ করে আয়</small>
</button>

<button type="button" onclick="showReferral()">
🎁
<b>Referral</b>
<small>বন্ধু আনুন</small>
</button>

<button type="button" onclick="showProfile()">
👤
<b>Profile</b>
<small>অ্যাকাউন্ট</small>
</button>

<button type="button" onclick="showWithdraw()">
💸
<b>Withdraw</b>
<small>টাকা তুলুন</small>
</button>

</section>

<div id="content" class="panel">
<h2>🏠 Home</h2>
<p>আপনার Mini App প্রস্তুত।</p>
</div>

<nav>
<button type="button" onclick="home()">🏠</button>
<button type="button" onclick="loadTasks()">📋</button>
<button type="button" onclick="showReferral()">🎁</button>
<button type="button" onclick="showProfile()">👤</button>
</nav>

</main>

<!-- IMPORTANT: app.js must be loaded -->
<script src="./app.js"></script>

</body>
</html>
